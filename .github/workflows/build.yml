name: build

# 让"能不能构建成功"变成 GitHub 上看得见的状态：
# 每次 push / PR 都真跑一遍构建 + 存储层测试，失败就红。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Locate SDK components
        id: sdk
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "android_jar=$SDK/platforms/android-34/android.jar" >> "$GITHUB_OUTPUT"
          echo "build_tools=$SDK/build-tools/34.0.0" >> "$GITHUB_OUTPUT"
          ls "$SDK/platforms" "$SDK/build-tools"

      # ---------------------------------------------------------------- 测试
      # 存储层测试跑在普通 JVM 上：不需要设备、不需要模拟器，
      # 这是本项目能在 CI 里几分钟跑完的关键（见 docs/TROUBLESHOOTING.md）。
      - name: Run storage tests
        run: |
          set -euo pipefail
          mkdir -p build/test
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "${{ steps.sdk.outputs.android_jar }}:${{ steps.sdk.outputs.build_tools }}/core-lambda-stubs.jar" \
            -classpath "${{ steps.sdk.outputs.android_jar }}" \
            -nowarn -d build/test \
            android/java/com/draftguard/LogStore.java \
            android/java/com/draftguard/Record.java \
            android/java/com/draftguard/Json.java \
            test/StoreTest.java
          java -cp "build/test:${{ steps.sdk.outputs.android_jar }}" com.draftguard.StoreTest
        # 测试只要有一项 FAIL 就返回非零，CI 直接变红

      # ---------------------------------------------------------------- 构建
      - name: Build APK
        env:
          BT: ${{ steps.sdk.outputs.build_tools }}
          AJ: ${{ steps.sdk.outputs.android_jar }}
        run: |
          set -euo pipefail
          rm -rf build/apk && mkdir -p build/apk/{res,gen,classes,dex}

          # 1. 编译资源
          "$BT/aapt2" compile --dir android/res -o build/apk/res.zip

          # 2. 链接资源表（生成 R.java 与基础 APK）
          "$BT/aapt2" link \
            -o build/apk/base.apk \
            -I "$AJ" \
            --manifest android/AndroidManifest.xml \
            --java build/apk/gen \
            --min-sdk-version 26 \
            --target-sdk-version 33 \
            --version-code "${GITHUB_RUN_NUMBER}" \
            --version-name "2.0.${GITHUB_RUN_NUMBER}" \
            --auto-add-overlay \
            build/apk/res.zip

          # 3. 编译 Java（lambda 引导方法在 core-lambda-stubs.jar 里，必须进 bootclasspath）
          find android/java build/apk/gen -name '*.java' > build/apk/sources.txt
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$AJ:$BT/core-lambda-stubs.jar" \
            -classpath "$AJ" -nowarn \
            -d build/apk/classes @build/apk/sources.txt

          # 4. 转 dex（d8 要求输出目录已存在）
          (cd build/apk/classes && jar cf ../classes.jar .)
          "$BT/d8" --min-api 26 --lib "$AJ" --output build/apk/dex build/apk/classes.jar

          # 5. 把 dex 塞进 APK
          cp build/apk/base.apk build/apk/unsigned.apk
          (cd build/apk/dex && zip -q -X ../unsigned.apk classes.dex)

          # 6. 对齐
          "$BT/zipalign" -f -p 4 build/apk/unsigned.apk build/apk/aligned.apk

      # ---------------------------------------------------------------- 签名
      # 优先用仓库 secrets 里的正式密钥：这样 CI 出的包和本地 release.ps1 出的包
      # 签名一致，可以互相覆盖升级。没配 secrets 时退回临时密钥（fork / PR 场景），
      # 构建依然能通过，只是那个包不能覆盖已装版本。
      - name: Sign APK
        env:
          BT: ${{ steps.sdk.outputs.build_tools }}
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            echo "使用仓库 secrets 中的正式签名密钥"
            echo "$KS_B64" | base64 -d > build/apk/release.keystore
            STORE_PASS="${KS_PASS:?缺少 RELEASE_STORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-draftguard}"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次使用临时密钥签名（不能覆盖已安装的正式版本）"
            keytool -genkeypair -keystore build/apk/release.keystore \
              -alias draftguard -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=DraftGuard CI, O=DraftGuard, C=CN" >/dev/null 2>&1
            STORE_PASS=android
            ALIAS=draftguard
          fi
          "$BT/apksigner" sign \
            --ks build/apk/release.keystore --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" --ks-key-alias "$ALIAS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out DraftGuard-ci.apk build/apk/aligned.apk
          "$BT/apksigner" verify --print-certs DraftGuard-ci.apk | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftGuard-CI-${{ github.run_number }}
          path: DraftGuard-ci.apk
          if-no-files-found: error

      # ---------------------------------------------------------------- 发布
      # 推 tag（v2.0.1 这种）时，自动建 Release 并把 APK 附上去。
      # 这样手机上直接点 Release 里的 APK 就能下载安装，不用自己构建。
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DraftGuard-ci.apk
          generate_release_notes: true
          body: |
            自动构建的调试签名 APK，可直接安装。

            - 支持 Android 8.0+（minSdk 26）
            - 安卓 13+ 需先允许受限设置：设置 → 应用 → DraftGuard → ⋮ → 允许受限设置
            - 详细说明见 [README](https://github.com/${{ github.repository }}#install)
